<!DOCTYPE html>
<html>
    <head>
<meta charset="utf-8">
<title>Formula 1 Race</title>
<link rel="stylesheet" href="stylew3.css">
    </head>
    <body>
    <h1>Formula 1 Race</h1>
    <p id="lap">Lap: 0/10 </p>
    <button id="startButton">Start Race</button>
    <button id="nextButton" disabled>Next Lap</button>
    <table>
        <thead>
            <tr>
                <th>Position</th>
                <th>Driver</th>
                <th>Team</th>
                <th>Speed</th>
                <th>Skill</th>
                <th>Time</th>
                <th>Tyres</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="driversTable"></tbody>
    </table>
    <h2>Race Events</h2>
    <div id="raceEvents"></div>
    <p id="winner"></p>
    <script src="scriptw3.js"></script>
    </body>
</html>
